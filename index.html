<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#0a0b0d"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>榜一</title>
<style>
  :root{
    --bg:#06070a; --panel:#0e1115; --panel2:#141920; --line:#1e242c; --line2:#2a323c;
    --txt:#e9edf2; --dim:#8f98a4; --dim2:#5f6875;
    --amber:#ffb347; --amber2:#ef9426; --rust:#c2542d; --ok:#5fd08a; --bad:#e2564a;
    --blue:#5aa7f0; --purple:#a77bf0; --gold:#e8c46a;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    overscroll-behavior:none;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;background:
    radial-gradient(120% 55% at 50% -8%,#151a21 0%,rgba(21,26,33,0) 62%),
    radial-gradient(90% 40% at 50% 108%,#120f0d 0%,rgba(18,15,13,0) 70%),var(--bg);
    background-attachment:fixed}
  #app{max-width:560px;margin:0 auto;min-height:100vh;
    padding:calc(12px + env(safe-area-inset-top)) 15px calc(92px + env(safe-area-inset-bottom))}
  #app>*{animation:in .3s cubic-bezier(.2,.7,.3,1) both}
  @keyframes in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

  .hd{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 12px}
  .brand{font-size:13px;letter-spacing:.42em;color:#cfd6de;font-weight:600}
  .gear{background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--dim);border-radius:9px;
    padding:6px 10px;font-size:11.5px;font-family:inherit;cursor:pointer}
  .sys{font-family:var(--mono);font-size:11.5px;line-height:1.7;color:#8b95a2;margin:0 2px 10px}
  .sys b{color:#e9edf2;font-weight:600}

  /* —— 场景 —— */
  .hero{position:relative;border-radius:18px;overflow:hidden;margin-bottom:10px;
    border:1px solid #232a33;background:#0a0c10;
    box-shadow:0 18px 40px -18px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.05)}
  .hero svg{display:block;width:100%}
  .hcap{position:absolute;left:13px;top:11px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;
    color:rgba(255,255,255,.62);text-shadow:0 1px 8px rgba(0,0,0,.9)}
  .hzone{position:absolute;right:11px;top:9px;font-size:10px;letter-spacing:.14em;padding:4px 10px;
    border-radius:99px;background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.16);
    color:#f3e9db;backdrop-filter:blur(6px)}
  .hodo{position:absolute;left:14px;bottom:11px;font-family:var(--mono);font-size:36px;line-height:.95;
    font-weight:600;letter-spacing:-1.5px;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.95)}
  .hodo small{font-size:13px;letter-spacing:0;margin-left:4px;opacity:.7}
  .hodo em{display:block;font-style:normal;font-size:9px;letter-spacing:.22em;opacity:.55;margin-top:5px}
  .dash.go{animation:dash 1.1s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-34}}
  .wh.spin{animation:spin 1.6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .veh.driving{animation:bob 1.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
  .dust{animation:dm 1.8s ease-out infinite}
  .dust.d1{animation-delay:.45s}.dust.d2{animation-delay:.9s}.dust.d3{animation-delay:1.35s}
  @keyframes dm{0%{opacity:.28;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(-26px,-9px) scale(1.7)}}
  .mapwrap{margin:0 2px 10px}

  .panel{background:linear-gradient(180deg,#101419,#0c0f13);border:1px solid var(--line);
    border-radius:16px;padding:15px;margin-bottom:11px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
  .ptitle{font-size:10px;letter-spacing:.24em;color:var(--dim2);margin:0 0 11px}
  .odo-wrap{text-align:center;padding:4px 0 0}
  .odo{font-family:var(--mono);font-size:54px;line-height:1;font-weight:600;
    font-variant-numeric:tabular-nums;letter-spacing:-2px}
  .odo small{font-size:18px;color:var(--dim);letter-spacing:0;margin-left:6px}
  .odolbl{font-size:10px;color:var(--dim2);letter-spacing:.22em;margin-top:9px}
  .track{height:5px;background:#1a1f26;border-radius:3px;margin:14px 0 9px;overflow:hidden}
  .track i{display:block;height:100%;border-radius:3px;
    background:linear-gradient(90deg,var(--rust),var(--amber) 70%,#ffd08a)}
  .lag{font-family:var(--mono);font-size:11.5px;text-align:center;color:var(--dim);margin:0 2px 11px}
  .lag b{color:var(--bad)} .lag b.ahead{color:var(--ok)}

  .bars{display:grid;grid-template-columns:1fr 1fr;gap:11px 15px}
  .bar{font-size:10.5px;color:var(--dim)}
  .bar .lab{display:flex;justify-content:space-between;margin-bottom:5px;font-family:var(--mono)}
  .bar .lab b{color:#c2c9d2;font-weight:600}
  .bar .lab b.low{color:var(--bad)}
  .bar .tr{height:6px;background:#1a1f26;border-radius:3px;overflow:hidden}
  .bar .tr i{display:block;height:100%;border-radius:3px;
    background:linear-gradient(90deg,#3fae74,var(--ok));transition:width .35s}
  .bar .tr i.mid{background:linear-gradient(90deg,#d0872c,var(--amber))}
  .bar .tr i.low{background:linear-gradient(90deg,#a8392f,var(--bad))}
  .cold{display:flex;align-items:center;gap:8px;margin:0 2px 11px;padding:8px 11px;
    background:rgba(226,86,74,.10);border:1px solid rgba(226,86,74,.30);border-radius:11px;
    font-size:11.5px;color:#f0a49d}

  .cls{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid #171c22;font-size:13px}
  .cls:last-child{border-bottom:0}
  .cls .tm{font-family:var(--mono);font-size:11px;color:var(--dim2);width:84px;flex:none}
  .cls .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cls.past .nm{color:var(--dim2)}
  .cls.now{border-left:2px solid var(--amber);padding-left:7px;margin-left:-9px}
  .cls .tag{font-size:9.5px;padding:2px 7px;border-radius:99px;background:#1b2027;color:var(--dim)}
  .cls .tag.listen{background:rgba(255,179,71,.14);color:var(--amber)}
  .gap{font-size:12px;color:var(--dim);margin:0 2px 12px;line-height:1.65}

  .task{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #171c22;font-size:13px}
  .task:last-child{border-bottom:0}
  .task .t{flex:1;min-width:0}
  .task .t small{display:block;color:var(--dim2);font-size:10.5px;margin-top:3px}
  .task .t small.hot{color:var(--bad)}
  .task.done .t{color:var(--dim2);text-decoration:line-through}
  .mini{background:rgba(255,255,255,.03);border:1px solid var(--line);color:#aeb7c2;border-radius:9px;
    padding:5px 10px;font-size:11px;font-family:inherit;cursor:pointer}
  .mini:active{border-color:var(--amber);color:var(--amber)}
  .mini.on{border-color:var(--ok);color:var(--ok)}

  .chips{display:flex;gap:8px;margin:0 2px 12px}
  .chip{flex:1;background:linear-gradient(180deg,#131820,#0d1116);border:1px solid var(--line);
    border-radius:13px;padding:9px 6px;text-align:center}
  .chip .v{font-family:var(--mono);font-size:18px;font-weight:600;line-height:1.1}
  .chip .k{font-size:9.5px;color:var(--dim2);margin-top:3px;letter-spacing:.14em}

  .btns{display:flex;flex-direction:column;gap:9px;margin:12px 2px 0}
  .big{width:100%;border:none;border-radius:15px;padding:15px;font-size:14.5px;font-weight:600;
    font-family:inherit;cursor:pointer;text-align:center;transition:transform .06s,box-shadow .2s;
    letter-spacing:.02em}
  .big:active{transform:scale(.982)}
  .big.primary{background:linear-gradient(180deg,#ffc876,#ee9726);color:#251703;
    box-shadow:0 10px 26px -10px rgba(255,160,58,.65),inset 0 1px 0 rgba(255,255,255,.5)}
  .big.ghost{background:linear-gradient(180deg,#151b23,#101419);color:var(--txt);
    border:1px solid var(--line2);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
  .big[disabled]{opacity:.4;cursor:not-allowed;background:#101419;color:var(--dim);
    border:1px solid var(--line);box-shadow:none}
  .big .sub{display:block;font-size:10.5px;font-weight:400;opacity:.72;margin-top:4px;letter-spacing:.04em}
  .hint{font-size:11px;color:var(--dim2);text-align:center;margin:11px 2px 0;line-height:1.6}

  nav{position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:rgba(7,8,11,.9);backdrop-filter:blur(14px) saturate(140%);
    border-top:1px solid #181d24;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
  nav .in{max-width:560px;margin:0 auto;display:flex;gap:2px;padding:0 8px}
  nav button{flex:1;background:none;border:none;color:var(--dim2);font-size:10.5px;font-family:inherit;
    padding:8px 0 6px;cursor:pointer;letter-spacing:.08em;border-radius:11px;transition:.18s}
  nav button.on{color:var(--amber);background:linear-gradient(180deg,rgba(255,179,71,.10),rgba(255,179,71,0))}
  nav button .dot{display:block;width:4px;height:4px;border-radius:2px;background:var(--amber);
    margin:4px auto 0;opacity:0;box-shadow:0 0 8px var(--amber)}
  nav button.on .dot{opacity:1}

  .mask{position:fixed;inset:0;background:rgba(0,0,0,.74);z-index:40;display:flex;
    align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);
    animation:fade .2s ease both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:linear-gradient(180deg,#141920,#0e1115);border:1px solid #2c343e;border-radius:20px;
    padding:21px;width:100%;max-width:400px;max-height:84vh;overflow:auto;
    box-shadow:0 30px 70px -20px #000;animation:pop .26s cubic-bezier(.2,.9,.3,1.1) both}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
  .modal h3{margin:0 0 7px;font-size:17px}
  .modal p{margin:0 0 14px;font-size:12.5px;color:var(--dim);line-height:1.7}
  .focus{display:flex;gap:7px;margin:10px 0 4px}
  .focus button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:11px;padding:11px 2px;font-size:10.5px;font-family:inherit;cursor:pointer;line-height:1.35}
  .focus button:active{border-color:var(--amber);color:var(--amber)}
  .focus button b{display:block;font-size:16px;margin-bottom:3px}
  .loot{font-family:var(--mono);font-size:12.5px;line-height:1.95}
  .loot .q0{color:#c9ced4}.loot .q1{color:var(--ok)}.loot .q2{color:var(--blue)}
  .loot .q3{color:var(--purple)}.loot .q4{color:var(--gold)}
  .lootbox{width:74px;height:74px;margin:2px auto 16px;border-radius:18px;position:relative;
    display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:22px;
    background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.16),rgba(255,255,255,.02) 70%);
    border:1px solid rgba(255,255,255,.18);animation:glow 2.2s ease-in-out infinite}
  @keyframes glow{0%,100%{box-shadow:0 0 0 rgba(0,0,0,0)}50%{box-shadow:0 0 46px var(--qc,#fff)}}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;
    background:#1b2129;border:1px solid #303844;color:var(--txt);font-size:12px;
    padding:9px 15px;border-radius:11px;pointer-events:none;max-width:88vw;text-align:center;
    box-shadow:0 12px 30px -10px #000;animation:in .25s both}

  .car{position:relative;height:104px;margin:0 auto;width:100%;max-width:300px}
  .car .body{position:absolute;left:4%;right:4%;bottom:22px;height:40px;border-radius:9px;
    background:#252a32;border:1px solid #343b45}
  .car .cab{position:absolute;left:24%;width:34%;bottom:22px;height:26px;border-radius:8px 8px 2px 2px;
    background:#20252c;border:1px solid #343b45;border-bottom:none}
  .car .w{position:absolute;bottom:8px;width:22px;height:22px;border-radius:50%;
    background:#0d0f12;border:2px solid #333a44}
  .car .w1{left:16%} .car .w2{right:16%}
  .car .rack{position:absolute;left:10%;right:10%;bottom:62px;height:4px;border-radius:2px;
    background:#3a4250;opacity:0}
  .car .cur{position:absolute;left:26%;width:30%;bottom:44px;height:12px;border-radius:6px 6px 0 0;
    background:repeating-linear-gradient(90deg,#3d2f2a,#3d2f2a 4px,#2c2320 4px,#2c2320 8px);opacity:0}
  .car .lt{position:absolute;left:12%;right:12%;bottom:66px;height:3px;border-radius:2px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:0;box-shadow:0 0 12px var(--gold)}
  .car .paint{position:absolute;left:4%;right:4%;bottom:22px;height:40px;border-radius:9px;opacity:0;
    background:repeating-linear-gradient(115deg,rgba(255,179,71,.22),rgba(255,179,71,.22) 9px,transparent 9px,transparent 20px)}
  .car.lv2 .rack,.car.lv3 .rack,.car.lv4 .rack,.car.lv5 .rack{opacity:1}
  .car.lv3 .cur,.car.lv4 .cur,.car.lv5 .cur{opacity:1}
  .car.lv4 .lt,.car.lv5 .lt{opacity:1}
  .car.lv5 .paint{opacity:1}
  .car .plate{position:absolute;left:50%;transform:translateX(-50%);bottom:-2px;font-family:var(--mono);
    font-size:10px;color:var(--dim2);letter-spacing:.12em;white-space:nowrap}
  .lvn{text-align:center;margin-top:4px}
  .lvn b{font-size:14px} .lvn span{font-size:11px;color:var(--dim2);margin-left:7px}

  .item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #171c22;font-size:13px}
  .item:last-child{border-bottom:0}
  .item .n{flex:1;min-width:0}
  .item .n small{display:block;color:var(--dim2);font-size:10.5px;margin-top:3px;line-height:1.45}
  .item .c{font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-right:4px}
  .furn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .fcard{background:linear-gradient(180deg,#151b23,#101419);border:1px solid var(--line);border-radius:12px;padding:10px}
  .fcard b{font-size:12px;display:block;margin-bottom:3px}
  .fcard small{font-size:10px;color:var(--dim2);line-height:1.45;display:block;min-height:30px}
  .fcard .buy{margin-top:8px;width:100%;background:none;border:1px solid var(--line);color:var(--amber);
    border-radius:8px;padding:5px;font-size:10.5px;font-family:inherit;cursor:pointer}
  .fcard .buy[disabled]{color:var(--dim2);border-color:#22262c}
  input,select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:9px;padding:9px;font-size:12.5px;font-family:inherit;width:100%}
  .f{display:flex;gap:8px;margin-top:8px}
  .rank{font-family:var(--mono);font-size:12px}
  .rank .r{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid #171c22;align-items:baseline}
  .rank .r:last-child{border-bottom:0}
  .rank .p{width:22px;color:var(--dim2);flex:none}
  .rank .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rank .km{color:var(--dim)}
  .rank .r.me{color:var(--amber)} .rank .r.me .p{color:var(--amber)}
  .sec{margin-top:18px}
  .k{font-family:var(--mono);font-size:10.5px;color:var(--dim2)}
  .picks{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:0 2px 11px}
  .pick{background:linear-gradient(180deg,#12171e,#0d1116);border:1px solid var(--line);border-radius:14px;
    padding:11px;cursor:pointer;transition:.18s;text-align:left;font-family:inherit;color:var(--txt)}
  .pick:active,.pick.on{border-color:rgba(255,179,71,.55);background:linear-gradient(180deg,#1a1a18,#12110e)}
  .pick svg{display:block;width:100%;height:auto;margin-bottom:6px;opacity:.95}
  .pick b{font-size:12.5px;display:block}
  .pick small{font-size:10px;color:var(--dim2);line-height:1.4;display:block;margin-top:3px}

  /* ===== v0.5 调色板：从灰蓝换到夜行者的暖紫棕 ===== */
  :root{
    --bg:#0b0912; --panel:#1a1730; --panel2:#221d3a; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.15);
    --txt:#f2ecff; --dim:#b7aecd; --dim2:#8b82a6;
    --amber:#ffb03a; --amber2:#f5911f; --rust:#c2542d; --ok:#5fe0a0; --bad:#ff6f61;
    --blue:#6cc0ff; --purple:#b28bff; --gold:#ffd479;
  }
  body{background:
    radial-gradient(100% 55% at 50% -12%,#241a3d 0%,rgba(36,26,61,0) 62%),
    radial-gradient(80% 45% at 50% 108%,#2a1a24 0%,rgba(42,26,36,0) 68%),var(--bg);
    background-attachment:fixed}
  .brand{color:#f4ecff;letter-spacing:.46em}
  .gear{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);color:#c9bfe0}

  /* —— 舞台 —— */
  .hero{border-radius:24px;margin-bottom:12px;border:1px solid rgba(255,255,255,.11);
    box-shadow:0 28px 60px -28px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.10)}
  .hud{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;
    padding:13px 14px 12px;pointer-events:none}
  .hud.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .hud.row.end{align-items:flex-end}
  .hday{font-family:var(--mono);font-size:10px;letter-spacing:.17em;color:rgba(255,255,255,.85);
    text-shadow:0 2px 10px rgba(0,0,0,.9)}
  .hpill{font-size:10px;letter-spacing:.05em;padding:5px 10px;border-radius:99px;
    background:rgba(14,10,24,.5);border:1px solid rgba(255,255,255,.2);color:#f8f2e8;
    backdrop-filter:blur(8px);white-space:nowrap}
  .hbig{font-family:var(--mono);font-size:40px;line-height:.94;font-weight:600;letter-spacing:-2px;
    color:#fff;text-shadow:0 4px 26px rgba(0,0,0,.95)}
  .hbig small{font-size:12px;letter-spacing:0;margin-left:3px;opacity:.7}
  .hbig em{display:block;font-style:normal;font-size:8.5px;letter-spacing:.22em;opacity:.62;margin-top:6px}
  .gz{display:flex;gap:6px;align-items:flex-end;padding-bottom:13px}
  .gz-item{width:7px;height:44px;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.18);
    border-radius:4px;position:relative;overflow:hidden}
  .gz-item i{position:absolute;left:0;bottom:0;width:100%;border-radius:3px;transition:height .45s;
    background:linear-gradient(180deg,#7bf0b4,#2fae76)}
  .gz-item i.mid{background:linear-gradient(180deg,#ffcf7a,#e08a1e)}
  .gz-item i.low{background:linear-gradient(180deg,#ff9d92,#c24034)}
  .gz-item span{position:absolute;left:-2px;bottom:-13px;width:11px;text-align:center;
    font-size:8px;color:rgba(255,255,255,.72);letter-spacing:0}

  /* —— 行动坞 —— */
  .dock{background:linear-gradient(180deg,rgba(38,32,66,.95),rgba(18,15,30,.98));
    border:1px solid rgba(255,255,255,.10);border-radius:24px;padding:12px 12px 11px;
    box-shadow:0 22px 50px -24px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.07);margin-bottom:11px}
  .dline{font-size:11.5px;color:#c4bade;margin:1px 2px 11px;line-height:1.5;letter-spacing:.01em}
  .acts{display:flex;gap:8px}
  .act{flex:1;border:1px solid rgba(255,255,255,.13);border-radius:18px;
    background:linear-gradient(180deg,rgba(78,66,120,.95),rgba(44,37,70,.98));
    padding:11px 4px 9px;color:#fff;font-family:inherit;display:flex;flex-direction:column;
    align-items:center;gap:1px;cursor:pointer;transition:transform .12s,box-shadow .2s,filter .2s}
  .act b{font-family:var(--mono);font-size:25px;line-height:1;letter-spacing:-.6px}
  .act span{font-size:9px;letter-spacing:.16em;color:rgba(255,255,255,.68)}
  .act em{font-style:normal;font-size:8.5px;color:rgba(255,255,255,.5);margin-top:6px;
    text-align:center;line-height:1.3;min-height:11px}
  .act.std{background:linear-gradient(180deg,#ffcb6b,#f5911f);color:#2b1a04;

<script>
(function(){
'use strict';

/* ---------- 常量 ---------- */
var KEY='bangyi.v03', TOTAL=1200, EXAM='2027-12-25', VER=3;
var WK=['日','一','二','三','四','五','六'];
var DKEY=['sun','mon','tue','wed','thu','fri','sat'];
var PSTART=[480,535,610,665,840,895,970,1025,1140,1195,1250];
var PEND=[525,580,655,710,885,940,1015,1070,1185,1240,1295];

/* 段：里程=时间 */
var SEG={
  short:{n:'短途',min:25,km:0.5,fuel:1},
  std:{n:'上路',min:50,km:1,fuel:1},
  long:{n:'长途',min:90,km:2,fuel:2}
};

/* 载具 */
var VEH={
  moto:{n:'摩托',slot:8,hang:2,tip:'长途只耗 1 格油'},
  pickup:{n:'皮卡',slot:16,hang:4,tip:'每箱多出一件'},
  van:{n:'面包车',slot:24,hang:6,tip:'后备箱最大'},
  rv:{n:'房车',slot:20,hang:8,tip:'状态衰减 −10%'}
};

/* 载具等级（累积生效） */
var LV=[
  {km:0,   mods:0, n:'破车', d:'还在跑'},
  {km:100, mods:1, n:'修好', d:'汽油 3 → 4 格',  fuel:1},
  {km:200, mods:1, n:'加架', d:'后备箱 +4 格',    slot:4},
  {km:400, mods:1, n:'铺内', d:'状态衰减 −20%',   decay:.2},
  {km:700, mods:1, n:'通电', d:'车内挂位 +2',     hang:2},
  {km:1050,mods:3, n:'涂装', d:'里程 ×1.05',      mul:.05}
];

/* 家具 */
var FURN={
  desk:{n:'折叠桌',d:'短途也一定掉箱子',p:25},
  lamp:{n:'小台灯',d:'20 点后跑段，里程 ×1.1',p:30},
  cup:{n:'保温杯',d:'每天第一口水多回 10',p:20},
  bed:{n:'吊床',d:'睡觉恢复 +10 精力',p:30},
  audio:{n:'车载音响',d:'感染满 3 时，点数只减 25%',p:35},
  fridge:{n:'冰箱',d:'水不占后备箱格位',p:40},
  photo:{n:'相框',d:'抛锚诊断从三问缩成一问',p:20},
  shelf:{n:'书架',d:'今日卡片显示每门课本段数',p:25}
};

/* 硬件节点 */
var NODES=[
  {id:'n1',n:'选型与框图',d:'框图 + BOM 初版'},
  {id:'n2',n:'电源树',d:'原理图·电源部分'},
  {id:'n3',n:'叠层与阻抗',d:'层叠图 + 阻抗计算表'},
  {id:'n4',n:'布局',d:'摆放 + 电源平面划分'},
  {id:'n5',n:'布线',d:'DDR 等长 + 差分对'},
  {id:'n6',n:'仿真',d:'SI/PI 结果'},
  {id:'n7',n:'打样与调试',d:'板子回来、跑通'}
];

/* 补给 */
var SUPPLY=[
  {water:1},
  {water:2},
  {water:3,biscuit:1},
  {water:5,wash:1},
  {water:5,wash:2,med:1}
];

/* 默认课表 */
var SCHED0={
  mon:[[1,2,'通信电子线路','09402H'],[3,4,'微机原理B·调','181'],[9,10,'通信原理A','11110H']],
  tue:[[1,2,'电磁场与电磁波','09202H'],[3,4,'数字信号处理','11507H'],[5,6,'微机原理B·调','10505H'],[7,8,'形势与政策5','10405H']],
  wed:[[3,4,'通信原理A','01206H'],[5,6,'电磁场与电磁波','11412H'],[7,8,'数字信号处理','01106H']],
  thu:[[3,4,'通信电子线路','11108H'],[5,6,'工程概论','10505H'],[9,10,'信息计量学','11407H']],
  fri:[[3,4,'通信系统建模与仿真B','11409H']]
};

var GHOSTS=[
  {n:'老陈',s:1.06},{n:'铁皮',s:1.02},{n:'M',s:.98},{n:'三花',s:.94},
  {n:'阿岚',s:.90},{n:'黑鸟',s:.86},{n:'白噪音',s:.82},{n:'小满',s:.78}
];

/* ---------- 工具 ---------- */
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pad(n){return n<10?'0'+n:''+n}
function dkey(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseKey(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function dayDiff(a,b){return Math.round((parseKey(b)-parseKey(a))/86400000)}
function hm(m){return pad(Math.floor(m/60))+':'+pad(m%60)}
function dur(m){var h=Math.floor(m/60),mm=m%60;
  if(h&&mm)return h+' 小时 '+mm+' 分'; if(h)return h+' 小时'; return m+' 分钟'}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(){return Math.random()}

/* ---------- 状态 ---------- */
function fresh(){
  return {
    v:VER, start:dkey(), day:dkey(), lastSeg:'',
    km:0, fuel:3, points:0, streak:0,
    veh:'', lvl:0, cname:'', mods:0,
    att:{}, sched:JSON.parse(JSON.stringify(SCHED0)),
    st:{full:100,thirst:100,nrg:100,hyg:100,inf:0},
    cold:0, lowStreak:0, bag:0,
    inv:{water:2,wash:1,biscuit:1,coffee:0,med:0},
    furn:[], boxes:0, days:{}, focusLog:[],
    tasks:[], hw:{min:0,node:{},today:0,tday:''},
    flow:0, flowReady:false,
    svcWeek:'', log:[], demo:false
  };
}
var S;
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){ var o=JSON.parse(raw); return fix(o) }
  }catch(e){}
  return fresh();
}
function fix(o){
  var d=fresh();
  for(var k in d){ if(!(k in o)) o[k]=d[k] }
  if(!o.st) o.st=d.st;
  ['full','thirst','nrg','hyg','inf'].forEach(function(k){ if(typeof o.st[k]!=='number') o.st[k]=d.st[k] });
  if(!o.inv) o.inv=d.inv;
  if(!Array.isArray(o.furn)) o.furn=[];
  if(!Array.isArray(o.tasks)) o.tasks=[];
  if(!o.hw||typeof o.hw.min!=='number') o.hw={min:0,node:{},today:0,tday:''};
  if(!o.hw.node) o.hw.node={};
  if(!o.days) o.days={};
  o.v=VER;
  return o;
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)) }catch(e){} }
function has(f){ return S.furn.indexOf(f)>=0 }

/* ---------- 派生数值 ---------- */
function maxFuel(){ return 3 + (S.lvl>=1?1:0) }
function slotMax(){ return VEH[S.veh].slot + (S.lvl>=2?4:0) }
function hangMax(){ return VEH[S.veh].hang + (S.lvl>=4?2:0) }
function decayMul(){
  var m=1;
  if(S.lvl>=3) m*=(1-LV[3].decay);
  if(S.veh==='rv') m*=.9;
  return m;
}
function kmMul(){ return S.lvl>=5 ? 1+LV[5].mul : 1 }

/* ---------- 课表 ---------- */
function attOf(n){ return S.att[n]||'self' }
function todayList(){
  var arr=S.sched[DKEY[new Date().getDay()]]||[];
  return arr.map(function(c){
    return [PSTART[c[0]-1],PEND[c[1]-1],c[2],c[3]||'',attOf(c[2])];
  }).sort(function(a,b){return a[0]-b[0]});
}
function nowInfo(){
  var d=new Date(), mins=d.getHours()*60+d.getMinutes();
  var busy=todayList(), cur=null, next=null, i;
  for(i=0;i<busy.length;i++){
    if(mins>=busy[i][0]&&mins<busy[i][1]){ cur=busy[i] }
    else if(busy[i][0]>mins){ next=busy[i]; break }
  }
  var inClass=!!(cur&&cur[4]==='listen');
  return {mins:mins,dw:d.getDay(),busy:busy,cur:cur,next:next,inClass:inClass,
    free: inClass?0:(next? next[0]-mins : 1440-mins)};
}
function roadBonus(){
  var d=new Date(), h=d.getHours(), dw=d.getDay();
  if(dw===5&&h>=12) return {m:1.5,label:'周五午后 · 高速路段'};
  if((dw===3||dw===4||dw===5)&&h>=8&&h<10) return {m:1.2,label:'黄金早晨 · 冷启动'};
  return {m:1,label:''};
}
function longOK(){
  var d=new Date(), tm=(d.getDay()+1)%7;
  if((S.st.inf||0)>=2) return false;
  return !((tm===1||tm===2)&&d.getHours()>=21);
}

/* ---------- 日期滚动 / 衰减 ---------- */
function rollover(){
  var t=dkey();
  if(S.day===t) return false;
  var days=dayDiff(S.day,t);
  var k=decayMul();
  var d1=Math.min(2,days), d2=Math.max(0,days-2);
  var per=d1*1+d2*0.5;
  step('full',-5*per*k); step('thirst',-8*per*k);
  step('nrg',-4*per*k); step('hyg',-8*per*k);
  ['full','thirst','nrg','hyg'].forEach(function(x){
    if(S.st[x]<45) S.st[x]=45;
  });
  if(S.bag){ S.st.nrg=clamp(S.st.nrg+20,0,100); S.bag=0 }
  if(S.cold&&S.cold>0) S.cold-=days;
  S.lowStreak = (S.st.full<30||S.st.thirst<30||S.st.hyg<30) ? S.lowStreak+1 : 0;
  if(S.lowStreak>=2&&!S.cold){ S.cold=3; S.lowStreak=0 }
  S.day=t; S.fuel=maxFuel(); S.flow=0; S.flowReady=false;
  S.hw.today=0; S.hw.tday='';
  var gap=S.lastSeg?dayDiff(S.lastSeg,t):99;
  if(gap>=3&&S.points>0){ S.points=0; S.log.push(t+' 电瓶亏电'); }
  save();
  if(gap>=7) setTimeout(function(){ breakDown(gap) },300);
  return true;
}
function step(k,d){ S.st[k]=clamp(S.st[k]+d,0,100) }

/* ---------- 掉落 ---------- */
var QN=['白','绿','蓝','紫','金'];
var QW=[55,25,13,6,1];
function rollQ(shift){
  var r=rnd()*100, acc=0, q=0;
  for(var i=0;i<5;i++){ acc+=QW[i]; if(r<acc){ q=i; break } }
  q+=shift;
  return clamp(Math.round(q),0,4);
}
function qualityShift(focus){
  var s=0;
  if(focus<=1) s-=2; else if(focus===2) s-=1;
  else if(focus===4) s+=1; else if(focus===5) s+=2;
  if(S.cold) s-=1;
  if(S.st.thirst<30) s-=1;
  if(S.st.nrg<30) s-=1;
  if(S.flowReady){ s+=2; }
  if((S.st.inf||0)>=1) s-=1;
  return s;
}
function supplyFor(q){
  var t=SUPPLY[q], out={};
  for(var k in t) out[k]=t[k];
  if(S.veh==='pickup'){ out.water=(out.water||0)+1 }
  return out;
}
function partRoll(q){
  if(q>=4) return 1;
  if(q===3) return rnd()<.30?1:0;
  if(q===2) return rnd()<.08?1:0;
  return 0
}
function rollFurn(q){
  if(q<2) return null;
  var p=q===2?.15:(q===3?.40:1);
  if(rnd()>p) return null;
  var pool=Object.keys(FURN).filter(function(f){return !has(f)});
  if(!pool.length) return 'dup';
  return pool[Math.floor(rnd()*pool.length)];
}

/* ---------- 计时器 ---------- */
var T=null;
function segMs(kind){
  if(S.demo) return 60000;
  return SEG[kind].min*60000;
}
function startSeg(kind){
  if(T) return;
  rollover();
  var cost=SEG[kind].fuel;
  if(kind==='long'&&S.veh==='moto') cost=1;
  if(S.fuel<cost){ toast('汽油不够，明早再来'); return }
  var ni=nowInfo();
  if(ni.inClass){ toast('这节课你要听，不上路'); return }
  if(SEG[kind].min>ni.free){ toast('空档只有 '+dur(ni.free)+'，装不下这段'); return }
  if(kind==='long'){
    if(!longOK()){ toast('明天有早八，今晚不跑长途'); return }
    if(S.cold){ toast('感冒了，跑不动长途'); return }
    if(S.st.full<30){ toast('太饿了，先吃点东西'); return }
    if(S.st.thirst<30){ toast('太渴了，先喝水'); return }
  }
  T={kind:kind,end:Date.now()+segMs(kind)};
  render();
  setTimeout(function(){ if(T&&T.kind===kind) finishSeg() },segMs(kind)+30);
}
function forceSeg(){
  if(!T) return;
  if(T.kind==='hw') finishHw(); else finishSeg();
}
function finishSeg(){
  var kind=T.kind, cost=SEG[kind].fuel;
  if(kind==='long'&&S.veh==='moto') cost=1;
  T=null;
  S.fuel=Math.max(0,S.fuel-cost);
  var rb=roadBonus();
  var mul=rb.m*kmMul()*(has('lamp')&&new Date().getHours()>=20?1.1:1)*(S.cold?.85:1);
  var gain=Math.round(SEG[kind].km*mul*10)/10;
  var t=dkey();
  S.km=Math.round((S.km+gain)*10)/10;
  if(!S.days[t]) S.days[t]={seg:0,km:0};
  S.days[t].seg++; S.days[t].km=Math.round((S.days[t].km+gain)*10)/10;
  S.streak = (S.lastSeg&&dayDiff(S.lastSeg,t)===1)?S.streak+1:(S.lastSeg===t?S.streak:1);
  S.lastSeg=t;
  step('full',kind==='short'?-6:kind==='std'?-12:-20);
  step('thirst',kind==='short'?-8:kind==='std'?-15:-25);
  step('hyg',-10);
  if(new Date().getHours()>=23) step('nrg',-25);
  var pts=Math.max(1,Math.round(SEG[kind].km));
  if(S.st.inf>=3) pts=has('audio')? Math.max(1,Math.round(pts*.75)) : Math.max(1,Math.round(pts*.5));
  S.points+=pts;
  S.pending={kind:kind,gain:gain,pts:pts,rb:rb.label,mul:mul};
  save(); render();
  askFocus();
}

function setSpec(v){ SPEC=v; toast(v?'记下了：推进了一件具体的事':'记下了，这段只是坐着'); }

function setFocus(n){
  var p=S.pending; if(!p) return;
  var shift=qualityShift(n);
  S.focusLog.push(n); if(S.focusLog.length>30) S.focusLog.shift();
  if(n>=4) S.flow++; else S.flow=0;
  if(S.flowReady) S.flowReady=false;
  var q=rollQ(shift);
  var sup=supplyFor(q), got=[];
  for(var k in sup){ S.inv[k]=(S.inv[k]||0)+sup[k]; got.push(NAME[k]+' ×'+sup[k]) }
  var fe=rollFurn(q);
  var fu=null;
  if(fe==='dup'){ S.points+=5; fu='（家具重复，拆成 5 点）' }
  else if(fe){ S.furn.push(fe); fu=FURN[fe].n; }
  var boxP;
  if(p.kind==='long') boxP = (SPEC===1)?1:0;
  else boxP = has('desk')?1:.5;
  var loot = rnd()<boxP;
  if(loot) S.boxes++;
  S.pending={loot:loot,q:q,sup:got,furn:fu};
  if(n<=2){
    var low=S.focusLog.slice(-3).every(function(x){return x<=2});
    if(low) S.pending.low=true;
  }
  if(S.flow>=3&&!S.flowReady) S.flowReady=true;
  if(maybeEvent(0.35)) { SPEC=null; save(); showLoot(); return }
  SPEC=null; save();
  showLoot();
}
function showLoot(){
  var p=S.pending||{};
  var h='<div class="modal"><h3>'+(p.loot?'捡到一个箱子':'这段跑完了')+'</h3>';
  h+='<p class="loot">品质 <span class="q'+p.q+'">'+QN[p.q]+'</span>';
  if(p.sup&&p.sup.length) h+='<br>'+p.sup.join('　');
  if(p.furn) h+='<br>家具：'+p.furn;
  if(!p.sup||!p.sup.length){ if(!p.furn) h+='<br>这次没捡到箱子。' }
  if(p.low) h+='</p><p>连着几次不太专心。要不要把下一段缩到 25 分钟？</p>';
  h+='</p><button class="big primary" onclick="A.close()">收好</button></div>';
  modal(h,function(){});
}

/* ---------- 服务区 ---------- */
function weekKey(){
  var d=new Date(), t=new Date(d.getFullYear(),0,1);
  var w=Math.ceil(((d-t)/86400000+t.getDay()+1)/7);
  return d.getFullYear()+'-W'+w;
}
function svcOpen(){ return new Date().getDay()===0 }
function svcStock(){
  var w=weekKey();
  if(S.svcWeek!==w){
    var pool=Object.keys(FURN).filter(function(f){return !has(f)});
    var pick=[];
    while(pick.length<3&&pool.length){ pick.push(pool.splice(Math.floor(rnd()*pool.length),1)[0]) }
    S.svcFurn=pick; S.svcWeek=w; S.svcBought={};
    save();
  }
  return S.svcFurn||[];
}
function buy(kind){
  if(!svcOpen()) return toast('服务区只在周日开');
  var price={water:1,wash:1,biscuit:2,coffee:2,med:4,bag:5,mod:25}[kind];
  if(S.points<price) return toast('点数不够');
  S.points-=price;
  if(kind==='bag') S.bag=1;
  else if(kind==='mod') S.mods++;
  else S.inv[kind]=(S.inv[kind]||0)+1;
  toast('买了 '+({water:'水',wash:'洗漱包',biscuit:'压缩饼干',coffee:'咖啡',med:'感冒药',bag:'睡袋',mod:'改装件'}[kind]));
  save(); render();
}
function buyFurn(id){
  if(!svcOpen()) return toast('服务区只在周日开');
  if(has(id)) return toast('已经有了');
  var p=FURN[id].p;
  if(S.points<p) return toast('点数不够');
  S.points-=p; S.furn.push(id);
  toast('买下 '+FURN[id].n); save(); render();
}

  arr.sort(function(a,b){return b.km-a.km});

/* ---------- 声音：全部合成，没有音频文件 ---------- */
var _AC = null;
function sfxOn(){ return !!(S && S.sfx !== 0) }
function _ac(){
  if(!_AC){
    var C = window.AudioContext || window.webkitAudioContext;
    if(!C) return null;
    try { _AC = new C() } catch(e){ return null }
  }
  if(_AC.state === 'suspended'){ try{ _AC.resume() }catch(e){} }
  return _AC;
}
function _tone(f, dur, type, vol, delay, to){
  var a = _ac(); if(!a) return;
  var t = a.currentTime + (delay || 0);
  var o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f, t);
  if(to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || .05, t + .012);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + .03);
}
function _noise(dur, vol, freq){
  var a = _ac(); if(!a) return;
  var n = Math.max(1, Math.floor(a.sampleRate * dur));
  var b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
  for(var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  var s = a.createBufferSource(); s.buffer = b;
  var f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 1600; f.Q.value = .8;
  var g = a.createGain(); g.gain.value = vol || .05;
  s.connect(f); f.connect(g); g.connect(a.destination);
  s.start();
}
function snd(kind){
  if(!sfxOn()) return;
  switch(kind){
    case 'tap':    _tone(600, .04, 'triangle', .030); break;
    case 'open':   _tone(520, .07, 'sine', .055); _tone(780, .09, 'sine', .045, .055); break;
    case 'coin':   _tone(940, .055, 'square', .030); _tone(1410, .09, 'square', .026, .05); break;
    case 'start':  _tone(330, .14, 'sine', .050, 0, 470); break;
    case 'finish': _tone(523, .13, 'triangle', .050); _tone(784, .19, 'triangle', .042, .1); break;
    case 'win':    [523, 659, 784, 1046].forEach(function(f, i){ _tone(f, .22, 'triangle', .050, i * .085) }); break;
    case 'fail':   _tone(320, .15, 'sawtooth', .038, 0, 190); _tone(160, .3, 'sawtooth', .032, .13); break;
    case 'err':    _tone(170, .1, 'square', .038); break;
    case 'box':    _noise(.16, .045, 2200); _tone(680, .11, 'sine', .045, .05); break;
    case 'level':  [392, 523, 659, 880, 1046].forEach(function(f, i){ _tone(f, .26, 'sine', .045, i * .1) }); break;

  for(var i = 0; i < 7; i++){

    body += '<path d="M'+(180-hw(base))+','+base+' L'+(180-hw(top))+','+top+' L'+(180+hw(top))+','+top+' L'+(180+hw(base))+','+base+' Z" fill="url(#tbd)"/>'
     + '<path d="M'+(180-hw(base))+','+base+' L'+(180-hw(top))+','+top+'" stroke="'+c+'" stroke-width="1.6" opacity=".38"/>';
    [176,152,128,104,80].forEach(function(y){
      var w = hw(y);
      body += '<rect x="'+(180-w)+'" y="'+(y-3)+'" width="'+(w*2)+'" height="3" fill="#0c0a14" opacity=".55"/>';
      for(var k = 0; k < 3; k++) wins.push({x: 180 + (k-1) * Math.max(9, w*0.52), y: y + 6, w: 9, h: 11});
    });
    body += '<rect x="'+(180-hw(top)-9)+'" y="'+(top-6)+'" width="'+(hw(top)*2+18)+'" height="7" rx="2" fill="#2f2745"/>'
     + '<path d="M'+(180-hw(top)-11)+','+(top-6)+' L180,'+(top-30)+' L'+(180+hw(top)+11)+','+(top-6)+' Z" fill="#3a3054"/>'
     + '<path d="M180,'+(top-30)+' L180,'+(top-48)+'" stroke="#2f2745" stroke-width="1.8"/>'
     + '<path d="M180,'+(top-48)+' L196,'+(top-43)+' L180,'+(top-38)+' Z" fill="'+c+'" opacity=".85"/>';
  }

  if(shape === 'zig'){
    for(var i = 0; i < 5; i++){
      var y0 = base - i * 26, w2 = 74 - i * 12;
      body += '<rect x="'+(180-w2)+'" y="'+(y0-26)+'" width="'+(w2*2)+'" height="26" fill="url(#tbd)"/>'
       + '<rect x="'+(180-w2)+'" y="'+(y0-26)+'" width="'+(w2*2)+'" height="2.6" fill="#3d3357"/>'
       + '<rect x="'+(180-w2)+'" y="'+(y0-2.6)+'" width="'+(w2*2)+'" height="2.6" fill="#0c0a14" opacity=".7"/>';
      for(var k2 = 0; k2 < 3; k2++) wins.push({x: 180 + (k2-1) * 15, y: y0 - 12, w: 9, h: 11});
    }
    body += '<path d="M180,92 L180,64" stroke="#2f2745" stroke-width="1.8"/>'
     + '<path d="M180,64 L196,69 L180,74 Z" fill="'+c+'" opacity=".85"/>';
  }

  if(shape === 'twin'){
    [-1, 1].forEach(function(sgn, ci){
      var cx = 180 + sgn * 34;
      body += '<rect x="'+(cx-13)+'" y="86" width="26" height="'+(base-86)+'" fill="url(#tbd2)"/>'
       + '<rect x="'+(cx-13)+'" y="86" width="26" height="3" fill="#3d3357"/>'
       + '<path d="M'+(cx-13)+',86 L'+(cx-13)+','+base+'" stroke="'+c+'" stroke-width="1.3" opacity=".3"/>'
       + '<path d="M'+(cx-18)+',86 L'+(cx+18)+',86 L'+(cx+13)+',74 L'+(cx-13)+',74 Z" fill="#332a4c"/>';
      [176, 140, 104].forEach(function(y2){
        wins.push({x: cx, y: y2, w: 9, h: 12});
        wins.push({x: cx + sgn * 0.001, y: y2 + 0, w: 0.001, h: 0.001}); /* 占位，保持计数对齐 */
      });
    });
    body += '<rect x="146" y="118" width="68" height="9" rx="2" fill="#332a4c"/>'
     + '<rect x="146" y="118" width="68" height="2" rx="1" fill="#4a3f6a"/>'
     + '<path d="M146,126 L214,126" stroke="#0c0a14" stroke-width="2" opacity=".7"/>';
  }

  if(shape === 'bulb'){
    body += '<rect x="156" y="108" width="48" height="'+(base-108)+'" fill="url(#tbd)"/>'
     + '<path d="M156,108 A24,26 0 0 1 204,108 Z" fill="#3a3054"/>'
     + '<path d="M156,108 L156,'+base+'" stroke="'+c+'" stroke-width="1.3" opacity=".3"/>'
     + '<path d="M180,82 L180,60" stroke="#2f2745" stroke-width="1.8"/>'
     + '<path d="M180,60 L196,65 L180,70 Z" fill="'+c+'" opacity=".85"/>';
    /* 缠在塔身上的一条风带 */
    body += '<path d="M150,150 C 186,140 214,158 150,166 " stroke="'+c+'" stroke-width="2.2" fill="none" opacity=".28"/>'
     + '<path d="M150,174 C 186,164 214,182 150,190 " stroke="'+c+'" stroke-width="2.2" fill="none" opacity=".18"/>';
    [122, 146, 170].forEach(function(y3){
      wins.push({x: 168, y: y3, w: 8, h: 10});
      wins.push({x: 192, y: y3, w: 8, h: 10});
    });
  }

  /* 窗：从下往上数前 lit 扇亮 */
  var shown = wins.filter(function(w){ return w.w > 1 });
  var onIdx = {};
  for(var q = 0; q < Math.min(lit, shown.length); q++) onIdx[q] = true;
  shown.forEach(function(w, idx){
    var on = !!onIdx[idx];
    if(on) body += '<circle cx="'+w.x+'" cy="'+(w.y+w.h/2)+'" r="11" fill="url(#tlamp)"/>';
    body += '<rect x="'+(w.x-w.w/2)+'" y="'+w.y+'" width="'+w.w+'" height="'+w.h+'" rx="1.6" fill="'+(on?c:'#0e0b16')+'"/>';
    if(!on) body += '<rect x="'+(w.x-w.w/2)+'" y="'+w.y+'" width="'+w.w+'" height="'+w.h+'" rx="1.6" fill="none" stroke="#3a3054" stroke-width=".8"/>';
  });

  /* 门 */
  body += '<rect x="167" y="176" width="26" height="20" rx="2" fill="'+(open?c:'#0f0d16')+'" opacity="'+(open?'.9':'1')+'"/>'
   + '<rect x="167" y="176" width="26" height="20" rx="2" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="1.2"/>';
  if(open) body += '<ellipse cx="180" cy="198" rx="52" ry="11" fill="url(#tglow)"/>';
  body += '<rect x="160" y="194" width="40" height="4" rx="1.5" fill="#241d31"/>'
   + '<rect x="155" y="198" width="50" height="4" rx="1.5" fill="#1c1726"/>';

  return s + body + '</svg>';
}

function renderTower(){
  var sel = S.towerSel || 'math', t = TOWER_OF(sel), w = towerWin();
  var done = towerDone(sel), rd = w && w.id === sel && towerReady();
  var inTower = S.tq && S.tq.id === sel;
  var lit = done ? 15 : (rd ? 9 : (inTower ? 5 : 3));
  var h = '<div class="hero">' + towerVSvg(t, lit, rd || done)
   + '<div class="hud"><div class="hud row"><span class="hday">' + t.n + '</span>'
   + '<span class="hpill">' + t.sub + (done ? ' · 已 通 塔' : '') + '</span></div>'
   + '<div class="hud row end"><div class="hbig" style="font-size:22px">'
   + (done ? '已 空' : (inTower ? '第 ' + (S.tq.step + 1) + ' 关' : (rd ? '门 开 了' : '门 关 着')))
   + '<em>' + t.short + '</em></div></div></div></div>';

  h += '<div class="tlist">';
  TOWERS.forEach(function(x){
    var isDone = towerDone(x.id), isAct = w && w.id === x.id;
    h += '<button class="tcard' + (x.id === sel ? ' on' : '') + (isDone ? ' done' : '') + '" onclick="A.towerSel(\'' + x.id + '\')">'
     + '<b>' + x.n + '</b><span>' + x.sub + '</span>'
     + '<em>' + (isDone ? '已通' : (isAct ? (towerReady() ? '门开了' : '在塔下') : '未进')) + '</em></button>';
  });
  h += '</div>';

  h += '<div class="panel">';
  if(done){
    h += '<p class="ptitle">空 了</p><div class="hint" style="text-align:left;font-size:12px;line-height:1.7">这座塔已经空了。规则你记住了，剩下的靠每天那段路。</div>';
  } else if(inTower){
    h += '<p class="ptitle">还 在 里 面</p>'
     + '<div class="hint" style="text-align:left;font-size:12px;line-height:1.7">第 ' + (S.tq.step + 1) + ' 关，错了 ' + S.tq.wrong + ' 次。<br>三道关：账本 → 假规矩 → 一句话。</div>'
     + '<div class="btns"><button class="big primary" onclick="A.towerEnter()">接着过</button></div>';
  } else if(w && w.id === sel && !rd){
    var left = Math.max(0, Math.round((w.end - Date.now()) / 60000));
    h += '<p class="ptitle">还 在 塔 下</p>'
     + '<div class="hint" style="text-align:left;font-size:12px;line-height:1.7">'
     + '这段 90 分钟还没跑完' + (left ? '，还有 ' + left + ' 分钟' : '，去把它结算了') + '。<br>跑完记得问自己一句：这段真的进去了吗。</div>';
  } else if(rd){
    h += '<p class="ptitle">塔 门</p>'
     + '<div class="hint" style="text-align:left;font-size:12px;line-height:1.7">门开了。三道关：<br>'
     + '① 账本——照这周的真实数据，选一件最该改的<br>'
     + '② 假规矩——三条里有一条是假的<br>'
     + '③ 一句话——写给下周的自己<br>'
     + '只有第 ② 关判对错，错两次门才关。</div>'
     + '<div class="btns"><button class="big primary" onclick="A.towerEnter()">推门进去</button></div>';
  } else {
    h += '<p class="ptitle">进 塔</p>'
     + '<div class="hint" style="text-align:left;font-size:12px;line-height:1.7">进塔 = 一段 90 分钟的路，耗 2 格油。<br>里程照常算，只是这段路上多了一座塔。</div>'
     + '<div class="btns"><button class="big primary" onclick="A.towerStart(\'' + sel + '\')">进塔 · 90 分钟</button></div>';
  }
  h += '</div>';

    h += '<div class="panel"><p class="ptitle">上 次 你 说</p>'
     + '<div style="text-align:left;font-size:13px;line-height:1.8;color:#f3ecff">「' + S.towerNote.txt + '」</div>'
     + '<div class="hint" style="text-align:left;font-size:11px;line-height:1.7;margin-top:6px">' + S.towerNote.at + ' 写的。做到了吗？</div></div>';
  }

   + '<div class="hint" style="text-align:left;font-size:11.5px;line-height:1.8">四座塔各对应一门要考的东西，形状不一样，第一关的账也不一样。<br>通一座，给一件改装件、感染退一格。同一座塔只能通一次。</div></div>';
  return h;
}
function towerSel(id){ S.towerSel = id; save(); render() }
function towerStart(id){
  if(T) return toast('正在计时');
  if(towerDone(id)) return toast('这座塔已经空了');
  var w = towerWin();
  if(w && w.id === id && !towerReady()) return toast('这段还没跑完');
  var st = segState('long', nowInfo());
  if(!st.ok) return toast(st.why);
  S.towerSel = id;
  S.tower = {id: id, km0: S.km, end: Date.now() + segMs('long'), ready0: 1};
  S.tq = null;
  save();
  startSeg('long');
  snd('start');
  toast('进塔了。90 分钟后回来开门。');
}
function towerEnter(){
  if((S.st.inf||0)>=3) return toast('感染满了，塔门不开。先坐两分钟。');
  if(!towerReady()) return toast('还没到塔下');
  var t = TOWER_OF(S.tower.id);
  if(!S.tq || S.tq.id !== t.id){
    S.tq = {id: t.id, step: 0, wrong: 0, cards: towerCards(), pick: null};
    save();
  }
  towerStep();
}
function towerStep(){
  var q = S.tq; if(!q) return;
  var t = TOWER_OF(q.id), w = weekStats();
  var h = '<div class="modal"><h3>' + t.n + '</h3>'
   + '<p class="tprog">第 ' + (q.step + 1) + ' / 3 关 · 已错 ' + q.wrong + ' 次</p>';
  if(q.step === 0){
    h += '<p style="font-size:12.5px;line-height:1.9">这周你已经跑了 <b>' + w.seg + '</b> 段 · <b>' + w.km.toFixed(1) + '</b> 公里。'
     + (w.miss ? '有 <b>' + w.miss + '</b> 天没打开。' : '每天都打开了。') + '</p>'
     + '<p>哪一件最该改？</p>';
    (q.cards || []).forEach(function(cd, i){
      h += '<button class="rule" onclick="A.towerCard(' + i + ')">'
       + '<b style="display:block;font-size:13px;color:#f3ecff;margin-bottom:3px">' + cd.t + '</b>'
       + '<span style="font-size:11px;color:#8d84a8">' + cd.d + '</span></button>';
    });
  } else if(q.step === 1){
    h += '<p>只有一条是假的。指出它，门就开。</p>';
    t.rules.forEach(function(r, i){
      h += '<button class="rule" onclick="A.towerRule(' + i + ')">' + r + '</button>';
    });
  } else {
    h += '<p>最后一句。写给下周的自己。</p>'
     + '<textarea id="tn2" maxlength="60" rows="3" placeholder="比如：周三那天先跑一段再回消息" '
     + 'style="width:100%;box-sizing:border-box;background:#12101c;border:1px solid #2e2842;border-radius:12px;'
     + 'color:#f3ecff;padding:10px;font-size:13px;line-height:1.6;resize:none;font-family:inherit"></textarea>'
     + '<div class="btns"><button class="big primary" onclick="A.towerNote()">就是这句</button></div>';
  }
  h += '</div>';
  modal(h);
}
function towerCard(i){
  var q = S.tq; if(!q) return;
  var cd = (q.cards || [])[i]; if(!cd) return;
  q.pick = cd.t;
  q.step = 1;
  save();
  snd('open');
  towerStep();
}
function towerRule(i){
  var q = S.tq; if(!q) return;
  var t = TOWER_OF(q.id);
  var ok = (i === t.fake);
  if(!ok){
    q.wrong++;
    save();
    snd('err');
    return towerResolve(false, t);
  }
  q.step = 2;
  save();
  snd('open');
  towerStep();
}
function towerNote(){
  var q = S.tq; if(!q) return;
  var el = document.getElementById('tn2');
  var txt = el && el.value ? el.value.replace(/\s+/g, ' ').trim() : '';
  if(!txt) return toast('写一句，随便写');
  S.towerNote = {txt: txt.slice(0, 60), at: dkey()};
  save();
  snd('coin');
  towerResolve(true, TOWER_OF(q.id));
}
function towerResolve(lastOk, t){
  var q = S.tq, wrong = q ? q.wrong : 3;
  var pass = wrong === 0;
  S.tower = null;
  S.tq = null;
  var h = '';
  if(pass){
    S.mods = (S.mods || 0) + 1;
    var pts = wrong === 0 ? 5 : 2;
    S.points += pts;
    S.st.inf = Math.max(0, (S.st.inf || 0) - 1);
    if(!S.towerDone) S.towerDone = {};
    S.towerDone[t.id] = true;
    snd('win');
    h = '<div class="modal win"><h3>门 开 了</h3>'
     + '<p>假的是：「' + t.rules[t.fake] + '」</p>'
     + '<p style="color:var(--dim);font-size:12px;line-height:1.7">' + t.why + '</p>'
     + '<p>' + '账、规矩、那句话，都过了。' + '</p>'
     + '<p>+1 改装件 · +' + pts + ' 点 · 感染退一格</p>'
     + '<div class="btns"><button class="big primary" onclick="A.close()">出去</button></div></div>';
  } else {
    S.st.inf = Math.min(3, (S.st.inf || 0) + 1);
    if(!S.towerFail) S.towerFail = {};
    S.towerFail[t.id] = (S.towerFail[t.id] || 0) + 1;
    snd('fail');
    h = '<div class="modal"><h3>门 关 了</h3><p>错了 ' + wrong + ' 次。守塔人把门合上了。</p>'
     + '<p style="color:var(--dim);font-size:12px;line-height:1.7">假的是：「' + t.rules[t.fake] + '」<br>' + t.why + '</p>'
     + '<p>感染 +1。里程不退，塔下次再来。</p>'
     + '<div class="btns"><button class="big" onclick="A.close()">下去</button></div></div>';
  }
  save();
  modal(h);
}

function evApply(e){
  if(!e) return;
  if(e.p) S.points = Math.max(0, S.points + e.p);
  if(e.f) S.fuel = clamp(S.fuel + e.f, 0, maxFuel());
  if(e.inf) S.st.inf = clamp((S.st.inf || 0) + e.inf, 0, 3);
  if(e.box) S.boxes = (S.boxes || 0) + e.box;
  if(e.item) S.inv[e.item] = (S.inv[e.item] || 0) + (e.itemN || 1);
  if(e.st) for(var k in e.st) step(k, e.st[k]);
}

function pickEv(){
  var pool = [];
  for(var i = 0; i < EVENTS.length; i++) if(i !== S.lastEv) pool.push(i);
  return pool[Math.floor(rnd() * pool.length)];
}

function maybeEvent(p){
  if(S.curEv != null) return false;
  if(rnd() < p){ S.curEv = pickEv(); return true }
  return false;
}

function showEvent(idx){
  var ev = EVENTS[idx]; if(!ev) return;
  var h = '<div class="modal ev"><div class="evi">' + ev.ic + '</div><h3>' + ev.t + '</h3>'
    + '<p style="line-height:1.9">' + ev.x + '</p>';
  ev.o.forEach(function(o, i){
    h += '<button class="rule" onclick="A.evPick(' + i + ')">' + o.t + '</button>';
  });
  h += '</div>';
  modal(h);
  snd('open');
}

function evPick(i){
  var idx = S.curEv, ev = EVENTS[idx];
  if(!ev) return;
  var o = ev.o[i]; if(!o) return;
  evApply(o.e || {});
  S.lastEv = idx;
  S.curEv = null;
  save();
  snd(o.e && o.e.inf > 0 ? 'err' : 'coin');
  var h = '<div class="modal win"><div class="evi">' + ev.ic + '</div><h3>' + ev.t + '</h3>'
    + '<p style="line-height:1.9">' + o.r + '</p>'
    + (o.g ? '<p class="evg">' + o.g + '</p>' : '')
    + '<div class="btns"><button class="big primary" onclick="A.close()">继续</button></div></div>';
  modal(h);
}

function calmLeft(){
  if(!S.calmAt) return 0;
  var l = 120000 - (Date.now() - S.calmAt);
  return l > 0 ? Math.ceil(l / 1000) : 0;
}
function calm(){
  var t = dkey();
  if(S.calmDay === t) return toast('今天已经坐过了');
  if(!S.calmAt){
    S.calmAt = Date.now();
    save(); render();
    toast('坐下。两分钟后回来点结束。');
    return;
  }
  var left = calmLeft();
  if(left > 0) return toast('还差 ' + Math.floor(left / 60) + ' 分 ' + (left % 60) + ' 秒');
  S.calmAt = 0;
  S.calmDay = t;
  S.st.inf = Math.max(0, (S.st.inf || 0) - 1);
  save(); render();
  snd('open');
  toast(S.st.inf > 0 ? ('坐完了。感染 ' + S.st.inf + '/3') : '坐完了。感染清零');
}
function calmLbl(){
  if(S.calmDay === dkey()) return '坐过了';
  var l = calmLeft();
  if(S.calmAt && l > 0) return '结束 ' + Math.floor(l / 60) + ':' + pad(l % 60);
  return '静坐';
}

    ni.busy.forEach(function(c){
      var mode=attOf(c[2]);
      h+='<button class="cls" onclick="A.toggleAtt(\''+esc(c[2])+'\')">'
       +'<b>'+esc(c[2])+'</b><span>'+hm(c[0])+'–'+hm(c[1])+(c[3]?' · '+esc(c[3]):'')+'</span>'
       +'<em class="'+(mode==='self'?'g':'r')+'">'+(mode==='self'?'自学':'要听')+'</em></button>';
    });
    h+='</div>';
  }
  h+='</div>';

  if(S.tasks&&S.tasks.length){
    h+='<div class="panel"><p class="ptitle">这 周 要 交</p>';
    S.tasks.forEach(function(t,i){
      h+='<div class="item"><div class="n">'+esc(t.n)+(t.due?'<small> '+esc(t.due)+'</small>':'')+'</div>'
       +'<button class="mini" onclick="A.doneTask('+i+')">做完</button></div>';
    });
    h+='</div>';
  }

  h+='<div class="panel"><p class="ptitle">车</p>'
   +'<div class="lvn"><b>'+(S.cname?esc(S.cname):v.n)+'</b><span>L'+S.lvl+' '+L.n+'</span></div>'
   +'<div class="hint" style="text-align:left;margin:4px 0 0">'+slotMax()+' 格 · 挂位 '+hangMax()+' · 汽油 '+maxFuel()+' 格 · 改装件 '+S.mods+'</div>';
  if(nx){
    h+='<div class="item" style="margin-top:10px"><div class="n">下 一 级 · '+nx.n+'<small> '+nx.d+'</small></div>'
     +'<div class="c">'+Math.round(S.km)+'/'+nx.km+' km · '+S.mods+'/'+nx.mods+' 件</div></div>'
     +'<div class="btns"><button class="big '+(canUp()?'primary':'ghost')+'" '+(canUp()?'onclick="A.upgrade()"':'disabled')+'>'
     +(canUp()?'动手改':'还差点东西')+'</button></div>';
  } else {
    h+='<div class="hint" style="text-align:left;margin-top:10px">已经到顶了。它现在长得像一辆真的车。</div>';
  }
  h+='</div>';

  h+='<div class="panel"><p class="ptitle">服 务 区</p>'
   +'<div class="item"><div class="n">'+(svcOpen()?'今天开门':'周日才开')+'</div><div class="c">'+S.points+' 点</div></div>';
  h+='<div class="btns"><button class="big'+(svcOpen()?' primary':' ghost')+'" onclick="A.tab(\'svc\')">'+(svcOpen()?'去货架看看':'去看看（周日开张）')+'</button></div>';
  h+='</div>';

  h+='<div class="panel"><p class="ptitle">里 程</p>'
   +'<div class="item"><div class="n">当前区域</div><div class="c">'+ZONES[zoneOf(S.km)].n+'</div></div>'
   +'<div class="item"><div class="n">距终点</div><div class="c">'+Math.max(0,TOTAL-S.km).toFixed(1)+' km</div></div>'
   +'<div class="item"><div class="n">箱子里还压着</div><div class="c">'+S.boxes+' 个</div></div></div>';
  return h;
}
function renderRank(){
  var arr=rank(), h='<div class="panel"><p class="ptitle">榜 单</p><div class="rank">';
  arr.forEach(function(r,i){
    h+='<div class="r '+(r.me?'me':'')+'"><span class="p">'+(i+1)+'</span>'
     +'<span class="nm">'+esc(r.n)+'</span><span class="km">'+r.km.toFixed(1)+'</span></div>';
  });
  h+='</div><div class="hint" style="text-align:left">他们的速度跟着日历走。你只要比日历快，就能超过他们。</div></div>';
  return h;
}

/* ---------- 弹窗 ---------- */
function modal(html,cb){
  var old=$('mask'); if(old&&old.parentNode) old.parentNode.removeChild(old);
  var d=document.createElement('div'); d.className='mask'; d.id='mask';
  d.innerHTML=html;
  document.body.appendChild(d);
  if(cb) cb();
}
function closeModal(){
  var m=$('mask'); if(m&&m.parentNode) m.parentNode.removeChild(m);
  if(S.curEv!=null && S.curEv!==undefined){ showEvent(S.curEv); return }
  render();
}
function toast(m){
  var t=document.createElement('div'); t.className='toast'; t.textContent=m;
  document.body.appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t) },2200);
}
function breakDown(gap){
  var q=has('photo')?1:3;
  var h='<div class="modal"><h3>抛锚了</h3>';
  h+='<p>车停在路边 '+gap+' 天了。走个诊断协议，'+q+' 个问题，答完就能动。</p>';
  h+='<input id="q1" placeholder="这阵子最不想开的是哪一段？"/>';
  if(q>1) h+=' <input id="q2" style="margin-top:8px" placeholder="在躲的，是哪一种感觉？"/>';
  if(q>2) h+=' <input id="q3" style="margin-top:8px" placeholder="明天最小的一步是什么？"/>';
  h+='<div class="btns"><button class="big primary" onclick="A.close()">答完了，发车</button></div></div>';
  modal(h,function(){});
}

function renderSetup(){
  var h='<div class="modal"><h3>设置</h3>';
  h+='<p>存档里是你全部的路。导出一次，换手机也不会丢。</p>';
  h+='<div class="btns">';
  h+='<button class="big ghost" onclick="A.exp()">导出存档</button>';
  h+='<button class="big ghost" onclick="A.copy()">复制到剪贴板</button>';
  h+='<button class="big ghost" onclick="A.imp()">导入存档</button>';
  h+='<button class="big ghost" onclick="A.demo()">'+(S.demo?'关闭演示模式':'开演示模式（1 分钟 = 1 段）')+'</button>';
  h+='<button class="big ghost" onclick="A.close()">关闭</button>';
  h+='</div>';
  h+='<div class="sec"><p class="ptitle">课 表</p>';
  ['mon','tue','wed','thu','fri'].forEach(function(dw){
    var arr=S.sched[dw]||[];
    h+='<div style="margin-top:10px"><b style="font-size:12px;color:var(--dim)">周'+WK[DKEY.indexOf(dw)]+'</b></div>';
    arr.forEach(function(c,i){
      h+='<div class="item"><div class="n" style="font-size:12.5px">'
       +'<span class="k">'+c[0]+'-'+c[1]+' 节</span> '+esc(c[2])+'</div>'
       +'<button class="mini" onclick="A.delClass(\''+dw+'\','+i+')">删</button></div>';
    });
  });
  h+='<div class="sec"><p class="ptitle">加 一 节 课</p>';
  h+='<div class="f"><select id="cd">'+['mon','tue','wed','thu','fri'].map(function(d){
      return '<option value="'+d+'">周'+WK[DKEY.indexOf(d)]+'</option>'}).join('')+'</select></div>';
  h+='<div class="f"><select id="cf">'+[1,3,5,7,9].map(function(n){return '<option>'+n+'</option>'}).join('')+'</select>'
   +'<select id="ct">'+[2,4,6,8,10].map(function(n){return '<option>'+n+'</option>'}).join('')+'</select>'
   +'<button class="mini" style="white-space:nowrap">节次</button></div>';
  h+='<div class="f"><input id="cnm" placeholder="课名"/></div>';
  h+='<div class="f"><input id="crm" placeholder="教室（可不填）"/></div>';
  h+='<div class="btns"><button class="big ghost" onclick="A.addClass()">加上</button></div>';
  h+='</div>';
  h+='<div class="sec"><p class="ptitle">课 程 清 单</p>';
  h+='<div class="f"><input id="tn" placeholder="有截止的那件事"/></div>';
  h+='<div class="f"><input id="td" type="date"/></div>';
  h+='<div class="btns"><button class="big ghost" onclick="A.addTask()">加进清单</button></div>';
  S.tasks.forEach(function(t){
    h+='<div class="item"><div class="n" style="font-size:12.5px">'+esc(t.n)+'<small>'+t.due+'</small></div>'
     +'<button class="mini" onclick="A.delTask('+t.id+')">删</button></div>';
  });
  h+='</div>';
  h+='<div class="sec"><p class="ptitle">重 来</p>';
  h+='<div class="btns"><button class="big ghost" style="color:var(--bad)" onclick="A.reset()">清空一切，重新开始</button></div></div>';
  h+='</div>';
  return h;
}

/* ---------- API ---------- */
window.A={
  tab:tab, choose:function(k){ S.veh=k; S.fuel=maxFuel(); save(); render() },
  start:startSeg, force:forceSeg, focus:setFocus, spec:setSpec,
  close:closeModal,
  drink:drink, wash:wash, eat:eat, sleep:sleep, med:med, coffee:coffee,
  confess:confess, calm:calm,
  buy:buy, buyFurn:buyFurn, upgrade:upgrade, setName:setName,
  hwStart:hwStart, hwNode:hwNode,
  addTask:addTask, doneTask:doneTask, delTask:delTask,
  addClass:addClass, delClass:delClass, toggleAtt:toggleAtt,
  openAll:function(){
    if(!S.boxes) return;
    var n=Math.min(9,S.boxes), bonus=Math.min(9,n)-1;
    S.boxes-=n;
    var parts=0;
    for(var i=0;i<n;i++){
      var q=rollQ(Math.max(0,Math.round(bonus*.5)));
      var sup=supplyFor(q);
      for(var k in sup) S.inv[k]=(S.inv[k]||0)+sup[k];
      var fe=rollFurn(q);
      if(fe&&fe!=='dup') S.furn.push(fe);
      else if(fe==='dup') S.points+=5;
      if(partRoll(q)) parts++;
    }
    if(parts) S.mods+=parts;
    toast('开了 '+n+' 个箱子'+(parts?'，翻出 '+parts+' 件改装件':''));
    save(); render();
  },
  use:function(k){
    if(k==='water') return drink();
    if(k==='wash') return wash();
    if(k==='biscuit') return eat();
    if(k==='coffee') return coffee();
    if(k==='med') return med();
  },
  setup:function(){ modal(renderSetup(),function(){}); },
  closeSetup:closeModal,
  exp:function(){
    var s=JSON.stringify(S);
    var d=document.createElement('div'); d.className='mask';
    d.innerHTML='<div class="modal"><h3>存档</h3><p>复制下面这一整段，存到备忘录里。</p>'
      +'<textarea style="width:100%;height:150px;background:#0d0f12;color:#8b9199;border:1px solid #24282e;border-radius:8px;padding:10px;font-size:11px">'
      +esc(s)+'</textarea><div class="btns"><button class="big primary" onclick="A.close()">好</button></div></div>';
    document.body.appendChild(d);
  },
  copy:function(){
    var s=JSON.stringify(S);
    try{ navigator.clipboard.writeText(s); toast('复制好了') }catch(e){ toast('复制失败，用导出吧') }
  },
  imp:function(){
    var s=prompt('把存档粘进来：');
    if(!s) return;
    try{ var o=JSON.parse(s); S=fix(o); save(); closeModal(); toast('读进来了') }catch(e){ toast('这段不对') }
  },
  demo:function(){
    S.demo=!S.demo; save(); toast(S.demo?'演示模式：1 分钟 = 1 段':'已关闭演示');
    closeModal();
  },
  reset:function(){
    if(!confirm('清空一切？里程、箱子、车，全没了。')) return;
    localStorage.removeItem(KEY); S=fresh(); closeModal(); render();
  }
};

function sfxToggle(){ S.sfx = sfxOn() ? 0 : 1; save(); render(); snd('tap') }
A.towerSel=towerSel; A.towerStart=towerStart; A.towerEnter=towerEnter; A.towerCard=towerCard; A.towerRule=towerRule; A.towerNote=towerNote; A.sfxToggle=sfxToggle;
A.evPick=evPick; A.calm=calm; A.showEv=function(){ if(S.curEv!=null) showEvent(S.curEv) }; A.raw=function(){ return S };

/* ---------- 启动 ---------- */
S=load();
rollover();
render();

})();
</script>

  if(location.protocol!=='https:' && location.hostname!=='localhost' && location.hostname!=='127.0.0.1') return;
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
})();
</script>

<div id="pwaInstall" style="display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:99999">
  <button type="button" style="display:flex;align-items:center;gap:8px;padding:13px 22px;border:0;border-radius:999px;background:linear-gradient(180deg,#ffc561,#f0a02a);color:#241a05;font-size:15px;font-weight:700;font-family:inherit;box-shadow:0 10px 26px rgba(0,0,0,.5)">&#8595; 装到桌面</button>
</div>
<script>
(function(){
  var el = document.getElementById('pwaInstall');
  if(!el) return;
  if(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return;
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferred = e; el.style.display = 'block';
  });
  el.querySelector('button').addEventListener('click', function(){
    if(!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function(){ deferred = null; el.style.display = 'none'; });
  });
  window.addEventListener('appinstalled', function(){ el.style.display = 'none'; });
})();
</script>
